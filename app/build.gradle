plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.cybr47.instar'
    compileSdk 34

    defaultConfig {
        applicationId "com.cybr47.instar"
        minSdkVersion 28
        targetSdk 36
        versionCode 4
        versionName '0.1.0-alpha04'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.dexkit
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation libs.osmdroid

    // External library for shared preferences
    implementation libs.fileprefs
    // Testing dependencies
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core.v361

    // Compile-only dependency
    compileOnly files('libs/api-82.jar')
}
